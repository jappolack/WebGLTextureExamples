<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js HDR Example</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>

<div id="info">
    HDR Environment Example<br>
    studio.hdr loaded as background and reflections
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.178/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178/examples/jsm/"
        }
    }
</script>

<script type="module" src="./enviromental.js"></script>
</body>
</html>
